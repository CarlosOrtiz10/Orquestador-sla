[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orquestador-sla"
version = "1.0.0"
description = "Orquestador de incidentes de software y cumplimiento de SLA"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

